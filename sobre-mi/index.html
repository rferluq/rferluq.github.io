<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sobre mí">
    <meta name="author" content="rferluq">
    <title>Sobre mí</title>
    <link rel="stylesheet" type="text/css" href="../menu.css"/>
</head>
<body>
    <header>
        <a href="../index.html" id="botonatras">← Volver</a>
        <h1>Sobre mí</h1>
    </header>

    <!-- El contenido se carga desde sobre-mi.md (edita ese archivo, no este HTML). -->
    <main id="contenido" class="markdown">Cargando…</main>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script>
        const contenido = document.getElementById('contenido');
        fetch('sobre-mi.md')
            .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
            .then(md => { contenido.innerHTML = DOMPurify.sanitize(marked.parse(md)); })
            .catch(() => {
                contenido.innerHTML = '<p>No se ha podido cargar el contenido. ' +
                    'Abre la web desde GitHub Pages o un servidor local (no con doble clic en el archivo).</p>';
            });
    </script>
</body>
</html>
