<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Profile card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
</head>

<body>
  <div class="background1"></div>
  <div class="container">
    <div class="card">
      <div class="card-background"></div>

      <img src="./images/image-victor.jpg" alt="perfil photo">

      <div class="persona">
        <div class="name">Victor Crest</div>
        <div class="age">26</div>
      </div>

      <div class="city">London</div>

      <div class="info">
        <div class="infos">
          <span class="name">80K</span>
          <span class="social-info">Followers</span>
        </div>

        <div class="infos">
          <span class="name">803K</span>
          <span class="social-info">Likes</span>
        </div>

        <div class="infos">
          <span class="name">1.4K</span>
          <span class="social-info">Photos</span>
        </div>
      </div>
    </div>
  </div>

  <div class="background2"></div>
</body>

</html>
