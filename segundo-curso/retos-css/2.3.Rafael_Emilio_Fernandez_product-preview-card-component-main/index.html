<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">

  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>

  <div class="imagen"></div>

  <div class="contenido">

    <h2 class="categoria">Perfume</h2>

    <h1 class="nombre">Gabrielle Essence Eau De Parfum </h1>

    <p class="descripcion">A floral, solar and voluptuous interpretation composed by Olivier Polge,
      Perfumer-Creator for the House of CHANEL.</p>

    <div class="precio">

      <div class="precioConOferta">$149.99</div>

      <div class="precioSinOferta">$169.99</div>

    </div>

    <button class="botonComprar">Add to Cart</button>

  </div>

</body>

</html>
