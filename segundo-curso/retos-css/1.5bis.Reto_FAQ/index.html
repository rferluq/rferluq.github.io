<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <title>Frontend Mentor | FAQ accordion</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
</head>

<body>
  <div class="background"></div>

  <div class="card">
    <div class="titulo">
      <img class="icon" src="./assets/images/icon-star.svg">
      <h1>FAQs</h1>
    </div>
    <div class="questions">
      <div class="question">
        <h4 id="titulo1">What is Frontend Mentor, and how will it help me?</h4>
        <img src="./assets/images/icon-plus.svg" class="boton">
      </div>
      <div class="question">
        <h4 id="titulo2">Is Frontend Mentor free?</h4>
        <img src="./assets/images/icon-plus.svg" class="boton">
      </div>
      <div class="question">
        <h4 id="titulo3">Can I use Frontend Mentor projects in my portfolio?</h4>
        <img src="./assets/images/icon-plus.svg" class="boton">
      </div>
      <div class="question">
        <h4 id="titulo4">How can I get help if I'm stuck on a challenge?</h4>
        <img src="./assets/images/icon-plus.svg" class="boton">
      </div>
    </div>
  </div>
</body>

</html>
