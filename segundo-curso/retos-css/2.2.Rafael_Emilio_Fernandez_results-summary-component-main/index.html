<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Results summary component</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="resultado">
    <h2>Your Result</h2>

    <div class="totalPuntos">
      <h1>76</h1>

      <h6>of 100</h6>
    </div>

    <h1>Great</h1>

    <p>You scored higher than 65% of the people who have taken these tests.</p>
  </div>

  <div class="summary">
    <h2>Summary</h2>

    <div class="listaPuntuaciones">
      <div class="Reaction">
        <img src="./assets/images/icon-reaction.svg">
        <span>Reaction</span><span class="puntos">80 &nbsp</span><span> / 100</span>
      </div>
      <div class="Memory">
        <img src="./assets/images/icon-memory.svg">
        <span>Memory</span><span class="puntos">92 &nbsp</span><span> / 100</span>
      </div>
      <div class="Verbal">
        <img src="./assets/images/icon-verbal.svg">
        <span>Verbal</span><span class="puntos">61 &nbsp</span><span> / 100</span>
      </div>
      <div class="Visual">
        <img src="./assets/images/icon-visual.svg">
        <span>Visual</span><span class="puntos">72 &nbsp</span><span> / 100</span>
      </div>
    </div>

    <button>Continue</button>
  </div>
</body>

</html>
