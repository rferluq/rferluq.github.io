<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Vehículos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Gestor de Vehículos</h1>
        <p>Práctica de consumo de una API REST con JavaScript</p>
    </header>

    <main>
        <p id="mensaje"></p>

        <div id="inicio">
            <section id="sesion">
                <h2>Sesión</h2>
                <form id="formLogin">
                    <input type="text" id="nombreLogin" placeholder="Usuario" required>
                    <input type="password" id="passwordLogin" placeholder="Contraseña" required>
                    <button type="submit">Iniciar sesión</button>
                    <button type="button" id="botonCerrarSesion">Cerrar sesión</button>
                </form>
                <p id="estadoSesion">Sin sesión iniciada</p>
            </section>

            <section id="consultas">
                <h2>Consultas</h2>
                <div id="botones">
                    <button id="botonVehiculos">Mostrar vehículos</button>
                </div>
                <div id="busqueda">
                    <input type="text" id="inputBuscarId" placeholder="ID del vehículo">
                    <button id="botonBuscarId">Buscar por ID</button>
                </div>
            </section>

            <section id="formularios">
                <form id="formAnadir">
                    <h2>Añadir vehículo</h2>
                    <label for="marcaAnadir">Marca</label>
                    <input type="text" id="marcaAnadir" required>
                    <label for="modeloAnadir">Modelo</label>
                    <input type="text" id="modeloAnadir" required>
                    <label for="anioAnadir">Año</label>
                    <input type="number" id="anioAnadir" min="1900" max="2100" required>
                    <button type="submit">Añadir</button>
                </form>

                <form id="formModificar">
                    <h2>Modificar vehículo</h2>
                    <label for="idModificar">ID</label>
                    <input type="text" id="idModificar" required>
                    <label for="marcaModificar">Marca</label>
                    <input type="text" id="marcaModificar" required>
                    <label for="modeloModificar">Modelo</label>
                    <input type="text" id="modeloModificar" required>
                    <label for="anioModificar">Año</label>
                    <input type="number" id="anioModificar" min="1900" max="2100" required>
                    <button type="submit">Guardar cambios</button>
                </form>

                <form id="formEliminar">
                    <h2>Eliminar vehículo</h2>
                    <label for="idEliminar">ID</label>
                    <input type="text" id="idEliminar" required>
                    <button type="submit">Eliminar</button>
                </form>
            </section>

        </div>

        <section id="resultados" style="display: none">
            <button id="botonVolver">Volver</button>
            <h2 id="tituloResultados">Resultados</h2>
            <div id="contenido"></div>
        </section>
    </main>

    <div id="toast"></div>

</body>

</html>
